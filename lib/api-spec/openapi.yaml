          enum: [pending, processing, completed, failed, unknown, skipped]
        totalRecipients:
          type: integer
          minimum: 0
        emailQueued:
          type: integer
          minimum: 0
        pushQueued:
          type: integer
          minimum: 0
        sent:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        emailAvailable:
          type: boolean
        pushAvailable:
          type: boolean
        lastError:
          type: string
        createdAt:
          type: string
