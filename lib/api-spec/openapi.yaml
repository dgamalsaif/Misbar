openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orcid
    description: ORCID account authorization for registration
  - name: socialPublishing
    description: Owner-only publishing of research opportunities to connected social accounts
  - name: participantNotifications
    description: Email, in-app, and opt-in Web Push updates for registered research participants
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /orcid/start:
    get:
      operationId: startOrcidAuthorization
      tags: [orcid]
      summary: Start ORCID account authorization
      description: Starts the ORCID OAuth flow and redirects the participant to ORCID.
      responses:
        "302":
          description: Redirect to ORCID authorization
        "400":
          description: The request did not originate from an approved Misbar site origin
        "200":
          description: A popup response explaining that ORCID authorization is not configured
          content:
            text/html:
              schema:
                type: string
  /orcid/callback:
    get:
      operationId: completeOrcidAuthorization
      tags: [orcid]
      summary: Complete ORCID account authorization
      description: Exchanges the OAuth code and returns the ORCID iD to the registration popup.
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: state
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: error
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
      responses:
        "200":
          description: Popup page posts the authorization result to the registration form
          content:
            text/html:
              schema:
                type: string
        "400":
          description: OAuth state is missing, expired, or invalid
  /social/meta/start:
    post:
      operationId: startMetaSocialAuthorization
      tags: [socialPublishing]
      summary: Start Meta account authorization
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialOAuthStartResponse"
        "403":
          description: Owner authentication required
        "503":
          description: Meta application configuration is incomplete
  /social/x/start:
    post:
      operationId: startXSocialAuthorization
      tags: [socialPublishing]
      summary: Start X account authorization
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialOAuthStartResponse"
        "403":
          description: Owner authentication required
        "503":
          description: X application configuration is incomplete
  /admin/social/connections:
    get:
      operationId: listSocialConnections
      tags: [socialPublishing]
      summary: List connected social accounts without credentials
      responses:
        "200":
          description: Connections and server-side provider readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialConnectionsResponse"
        "403":
          description: Owner authentication required
  /admin/social/telegram:
    post:
      operationId: connectTelegramChannel
      tags: [socialPublishing]
      summary: Validate and connect a Telegram bot to a channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectTelegramBody"
      responses:
        "201":
          description: Connected channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectTelegramResponse"
        "400":
          description: Bot token or channel permissions are invalid
        "403":
          description: Owner authentication required
        "503":
          description: Telegram or encryption service is unavailable
  /admin/social/connections/{id}:
    delete:
      operationId: disconnectSocialConnection
      tags: [socialPublishing]
      summary: Disconnect a social account and erase its saved credentials
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "204":
          description: Disconnected
        "403":
          description: Owner authentication required
        "404":
          description: Connection not found
  /admin/programs/{id}/social-preview:
    get:
      operationId: getProgramSocialPreview
      tags: [socialPublishing]
      summary: Preview a privacy-filtered social post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Social post content and visibility decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialPublishingPreview"
        "403":
          description: Owner authentication required
        "404":
          description: Opportunity not found
        "409":
          description: Opportunity is not open for registration
  /admin/programs/{id}/social-posts:
    get:
      operationId: listProgramSocialPosts
      tags: [socialPublishing]
      summary: List publication attempts for an opportunity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Publication history by account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialPostsResponse"
        "403":
          description: Owner authentication required
    post:
      operationId: publishProgramToSocialAccounts
      tags: [socialPublishing]
      summary: Publish an opportunity to selected connected accounts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishSocialPostsBody"
      responses:
        "200":
          description: Publication results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishSocialPostsResponse"
        "207":
          description: Some accounts failed or have an uncertain result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishSocialPostsResponse"
        "400":
          description: Invalid accounts selected
        "403":
          description: Owner authentication required
        "404":
          description: Opportunity not found
        "409":
          description: Opportunity is not open for registration
  /admin/programs/{id}/social-seat-updates:
    get:
      operationId: listProgramSocialSeatUpdates
      tags: [socialPublishing]
      summary: List automatic seat updates and account delivery results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Recent automatic seat update history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialSeatUpdatesResponse"
        "403":
          description: Owner authentication required
        "503":
          description: The Render database migration is not ready
  /admin/social-seat-updates/{id}/retry:
    post:
      operationId: retrySocialSeatUpdate
      tags: [socialPublishing]
      summary: Retry account deliveries that definitely failed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "202":
          description: The event was requeued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialSeatUpdateRetryResponse"
        "403":
          description: Owner authentication required
        "404":
          description: Automatic seat update not found
        "409":
          description: No definitely failed deliveries can be retried
        "503":
          description: The retry could not be queued
  /admin/social/posts/{id}/retry:
    post:
      operationId: retrySocialPost
      tags: [socialPublishing]
      summary: Retry a publication that definitely failed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Retry result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishSocialPostResult"
        "207":
          description: Retry failed or result is uncertain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishSocialPostResult"
        "403":
          description: Owner authentication required
        "404":
          description: Publication record not found
        "409":
          description: Retry is unsafe or connection is unavailable
  /participant/notifications/push-config:
    get:
      operationId: getParticipantNotificationPushConfig
      tags: [participantNotifications]
      summary: Get public Web Push configuration
      responses:
        "200":
          description: Web Push availability and public VAPID key only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantPushConfig"
  /participant/notifications/access-link:
    post:
      operationId: requestParticipantNotificationAccess
      tags: [participantNotifications]
      summary: Request an email link to access the participant inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantNotificationAccessRequest"
      responses:
        "202":
          description: Generic response that does not reveal whether the email is registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantNotificationMessage"
        "400":
          description: Email is invalid
        "429":
          description: Access-link requests are rate limited
        "503":
          description: Email service or Render database is unavailable
  /participant/notifications/verify:
    post:
      operationId: verifyParticipantNotificationAccess
      tags: [participantNotifications]
      summary: Verify a one-time email link and start a participant session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantNotificationAccessVerification"
      responses:
        "200":
          description: Verified; sets a secure HttpOnly participant session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantNotificationSession"
        "400":
          description: Link is invalid, expired, or already used
        "503":
          description: Render database or session secret is unavailable
  /participant/notifications:
    get:
      operationId: listParticipantNotifications
      tags: [participantNotifications]
      summary: List notices for the verified participant email
      responses:
        "200":
          description: Private participant inbox and notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantNotificationInbox"
        "401":
          description: A one-time email link must be verified first
  /participant/notifications/{id}/read:
    patch:
      operationId: markParticipantNotificationRead
      tags: [participantNotifications]
      summary: Mark one participant notice as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Updated notice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantNotification"
        "401":
          description: Participant session is missing or expired
        "404":
          description: Notice not found for this participant
  /participant/notifications/preferences:
    patch:
      operationId: updateParticipantNotificationPreferences
      tags: [participantNotifications]
      summary: Update email notice preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantNotificationPreferenceUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantNotificationPreferences"
        "401":
          description: Participant session is missing or expired
  /participant/notifications/push-subscriptions:
    post:
      operationId: saveParticipantPushSubscription
      tags: [participantNotifications]
      summary: Save an opt-in browser push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantPushSubscriptionInput"
      responses:
        "201":
          description: Push subscription saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantNotificationPreferences"
        "400":
          description: Invalid push subscription
        "401":
          description: Participant session is missing or expired
        "409":
          description: Push endpoint is already linked to another verified email
        "503":
          description: Web Push configuration or Render database is unavailable
  /participant/notifications/push-subscriptions/remove:
    post:
      operationId: removeParticipantPushSubscription
      tags: [participantNotifications]
      summary: Remove a browser push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantPushSubscriptionRemoval"
      responses:
        "200":
          description: Push subscription removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantNotificationPreferences"
        "401":
          description: Participant session is missing or expired
  /participant/notifications/push-subscriptions/{id}:
    delete:
      operationId: removeParticipantPushDevice
      tags: [participantNotifications]
      summary: Remove one push-enabled browser from the participant account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Device removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantNotificationInbox"
        "401":
          description: Participant session is missing or expired
        "404":
          description: Device not found for this participant
  /participant/notifications/unsubscribe:
    post:
      operationId: unsubscribeParticipantEmailNotifications
      tags: [participantNotifications]
      summary: Unsubscribe from update emails using an opaque email link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantNotificationUnsubscribe"
      responses:
        "200":
          description: Email updates disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantNotificationMessage"
        "400":
          description: Unsubscribe link is invalid or expired
  /participant/notifications/logout:
    post:
      operationId: endParticipantNotificationSession
      tags: [participantNotifications]
      summary: End the current participant inbox session
      responses:
        "200":
          description: Participant cookie cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantNotificationMessage"
  /admin/programs/{id}/participant-notifications:
    get:
      operationId: listProgramParticipantNotifications
      tags: [participantNotifications]
      summary: List update notices and delivery outcomes for an opportunity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Recent update events and delivery summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramParticipantNotifications"
        "403":
          description: Owner authentication required
        "503":
          description: Render database migration is not ready
    post:
      operationId: publishProgramParticipantUpdate
      tags: [participantNotifications]
      summary: Explicitly publish an update to registered participants
      description: Does not run on ordinary opportunity edits; push messages do not contain the research title or personal data.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantResearchUpdateInput"
      responses:
        "202":
          description: Event recorded and channel deliveries queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramParticipantNotificationEvent"
        "400":
          description: Invalid update content
        "403":
          description: Owner authentication required
        "404":
          description: Opportunity not found
        "409":
          description: Idempotency key already belongs to different content
        "503":
          description: Render database migration is not ready
  /admin/participant-notifications/{id}/retry:
    post:
      operationId: retryProgramParticipantNotification
      tags: [participantNotifications]
      summary: Retry only confirmed failed email or push deliveries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "202":
          description: Confirmed failures were queued for another attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantNotificationRetryResponse"
        "403":
          description: Owner authentication required
        "404":
          description: Update event not found
        "409":
          description: No confirmed failed deliveries can be retried
        "503":
          description: Retry could not be queued
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SocialOAuthStartResponse:
      type: object
      properties:
        authorizeUrl:
          type: string
      required: [authorizeUrl]
    SocialConnection:
      type: object
      properties:
        id:
          type: number
        platform:
          type: string
          enum: [facebook, instagram, x, telegram]
        accountName:
          type: string
        status:
          type: string
          enum: [active, needs_reauth]
        tokenExpiresAt:
          type: string
          format: date-time
          nullable: true
        needsReauthorization:
          type: boolean
      required: [id, platform, accountName, status, tokenExpiresAt, needsReauthorization]
    SocialProviderReadiness:
      type: object
      properties:
        meta:
          type: boolean
        x:
          type: boolean
        telegram:
          type: boolean
      required: [meta, x, telegram]
    SocialConnectionsResponse:
      type: object
      properties:
        encryptionConfigured:
          type: boolean
        providers:
          $ref: "#/components/schemas/SocialProviderReadiness"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/SocialConnection"
      required: [encryptionConfigured, providers, connections]
    ConnectTelegramBody:
      type: object
      properties:
        botToken:
          type: string
          minLength: 20
          maxLength: 300
        chatId:
          type: string
          minLength: 2
          maxLength: 150
      required: [botToken, chatId]
    ConnectTelegramResponse:
      type: object
      properties:
        connection:
          $ref: "#/components/schemas/SocialConnection"
      required: [connection]
    SocialPublishingPreview:
      type: object
      properties:
        opportunityId:
          type: number
        text:
          type: string
        shareUrl:
          type: string
        imageUrl:
          type: string
        titleVisible:
          type: boolean
        specialtyVisible:
          type: boolean
        opportunityImageVisible:
          type: boolean
      required: [opportunityId, text, shareUrl, imageUrl, titleVisible, specialtyVisible, opportunityImageVisible]
    SocialPostRecord:
      type: object
      properties:
        id:
          type: number
        platform:
          type: string
          enum: [facebook, instagram, x, telegram]
        accountName:
          type: string
        status:
          type: string
          enum: [publishing, published, failed, unknown]
        statusLabel:
          type: string
        content:
          type: string
        externalPostId:
          type: string
        lastError:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, platform, accountName, status, statusLabel, content, externalPostId, lastError, publishedAt, createdAt, updatedAt]
    SocialPostsResponse:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/SocialPostRecord"
      required: [posts]
    SocialSeatUpdateDelivery:
      type: object
      properties:
        id:
          type: number
        platform:
          type: string
          enum: [facebook, instagram, x, telegram]
        accountName:
          type: string
        status:
          type: string
          enum: [publishing, published, failed, unknown, skipped]
        lastError:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, platform, accountName, status, lastError, publishedAt]
    SocialSeatUpdateEvent:
      type: object
      properties:
        id:
          type: number
        seatsLeft:
          type: number
        totalSeats:
          type: number
        firstAuthorSeatsLeft:
          type: number
        coAuthorSeatsLeft:
          type: number
        status:
          type: string
          enum: [pending, processing, completed, failed, unknown, skipped]
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/SocialSeatUpdateDelivery"
      required: [id, seatsLeft, totalSeats, firstAuthorSeatsLeft, coAuthorSeatsLeft, status, lastError, createdAt, deliveries]
    SocialSeatUpdatesResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/SocialSeatUpdateEvent"
      required: [events]
    SocialSeatUpdateRetryResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]
    PublishSocialPostsBody:
      type: object
      properties:
        connectionIds:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: number
            minimum: 1
      required: [connectionIds]
    PublishSocialPostResult:
      type: object
      properties:
        post:
          oneOf:
            - $ref: "#/components/schemas/SocialPostRecord"
            - type: "null"
        connectionId:
          type: number
        platform:
          type: string
          enum: [facebook, instagram, x, telegram]
        accountName:
          type: string
        message:
          type: string
      required: [post, connectionId, platform, accountName, message]
    PublishSocialPostsResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PublishSocialPostResult"
        message:
          type: string
      required: [results, message]
    ParticipantNotificationMessage:
      type: object
      properties:
        message:
          type: string
      required: [message]
    ParticipantPushConfig:
      type: object
      properties:
        enabled:
          type: boolean
        publicKey:
          type: [string, "null"]
      required: [enabled, publicKey]
    ParticipantNotificationAccessRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required: [email]
    ParticipantNotificationAccessVerification:
      type: object
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128
      required: [token]
    ParticipantNotificationSession:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]
    ParticipantNotification:
      type: object
      properties:
        id:
          type: number
        opportunityId:
          type: number
        stage:
          type: string
        title:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        readAt:
          type: [string, "null"]
          format: date-time
      required: [id, opportunityId, stage, title, message, createdAt, readAt]
    ParticipantNotificationPreferences:
      type: object
      properties:
        emailEnabled:
          type: boolean
        emailVerified:
          type: boolean
        pushEnabled:
          type: boolean
        pushAvailable:
          type: boolean
      required: [emailEnabled, emailVerified, pushEnabled, pushAvailable]
    ParticipantNotificationInbox:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/ParticipantNotification"
        unreadCount:
          type: integer
          minimum: 0
        preferences:
          $ref: "#/components/schemas/ParticipantNotificationPreferences"
        pushDevices:
          type: array
          items:
            $ref: "#/components/schemas/ParticipantPushDevice"
      required: [notifications, unreadCount, preferences, pushDevices]
    ParticipantPushDevice:
      type: object
      properties:
        id:
          type: number
        deviceLabel:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, deviceLabel, createdAt, updatedAt]
    ParticipantNotificationPreferenceUpdate:
      type: object
      properties:
        emailEnabled:
          type: boolean
      required: [emailEnabled]
    ParticipantPushSubscriptionKeys:
      type: object
      properties:
        p256dh:
          type: string
          minLength: 20
          maxLength: 200
        auth:
          type: string
          minLength: 8
          maxLength: 100
      required: [p256dh, auth]
    ParticipantPushSubscriptionInput:
      type: object
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 2048
        keys:
          $ref: "#/components/schemas/ParticipantPushSubscriptionKeys"
      required: [endpoint, keys]
    ParticipantPushSubscriptionRemoval:
      type: object
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 2048
      required: [endpoint]
    ParticipantNotificationUnsubscribe:
      type: object
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128
      required: [token]
    ParticipantResearchUpdateInput:
      type: object
      properties:
        idempotencyKey:
          type: string
          format: uuid
        stage:
          type: string
          enum: [general_update, seats_full, ethics_approved, submitted, under_review, accepted, published, completed]
        message:
          type: string
          minLength: 1
          maxLength: 1500
      required: [idempotencyKey, stage, message]
    ProgramParticipantNotificationEvent:
      type: object
      properties:
        id:
          type: number
        opportunityId:
          type: number
        idempotencyKey:
          type: string
